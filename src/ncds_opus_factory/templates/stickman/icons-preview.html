<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>吴道子 · 自由图标库预览</title>
<style>
  :root { --ink: #1a1a1a; --paper: #f3eee2; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    background-image: radial-gradient(rgba(0,0,0,.028) 1px, transparent 1px);
    background-size: 6px 6px;
  }
  header { padding: 28px 32px 8px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
  .sub { color: #6b6b6b; font-size: 13px; margin-top: 6px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px; padding: 24px 32px 60px;
  }
  .cell {
    background: rgba(255,255,255,.5); border: 1px solid rgba(0,0,0,.08);
    border-radius: 14px; padding: 18px 12px 14px; text-align: center; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .cell:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(0,0,0,.10); }
  .ico { width: 66px; height: 66px; margin: 0 auto 10px; color: var(--ink); }
  .ico svg { width: 100%; height: 100%; display: block; }
  .nm { font-size: 14px; font-weight: 600; }
  .id { font-size: 11px; color: #999; font-family: ui-monospace, monospace; margin-top: 2px; }
  .tag { display: inline-block; font-size: 10px; color: #b0568a;
    background: rgba(176,86,138,.10); border-radius: 6px; padding: 1px 7px; margin-top: 7px; }
  .kw { font-size: 11px; color: #8a7f6a; margin-top: 7px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>吴道子 · 自由图标库</h1>
  <div class="sub">点任意图标重播入场动效 · 黑剪影 / 纸纹舞台 · 与小黑人同源视觉</div>
</header>
<div class="grid" id="grid"></div>
<script src="icons.js"></script>
<script>
  const grid = document.getElementById('grid');
  RIG_ICON_LIST.forEach((ic) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML =
      '<div class="ico">' + ic.svg + '</div>' +
      '<div class="nm">' + ic.name + '</div>' +
      '<div class="id">' + ic.id + '</div>' +
      '<div class="tag">' + ic.enter + '</div>' +
      '<div class="kw">' + ic.keywords.slice(0, 4).join(' · ') + '</div>';
    const play = () => {
      const box = cell.querySelector('.ico');
      const e = RIG_ICON_ENTERS[ic.enter] || RIG_ICON_ENTERS.pop;
      box.animate(e.keyframes, e.options);
    };
    cell.addEventListener('click', play);
    grid.appendChild(cell);
    play();
  });
</script>
</body>
</html>
