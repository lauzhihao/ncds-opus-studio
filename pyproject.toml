[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncds-opus-factory"
version = "0.1.0"
description = "Five-command media engine + reusable video templates for ncds content production. No direct Feishu API calls — all Feishu IO goes through lark-cli."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.1",
    # yt-dlp 的 impersonation 依赖：抖音 extractor 靠它模拟浏览器 TLS 指纹绕反爬，
    # 缺它时报 "no impersonate target available"、抖音加强反爬后下载可能失效。
    "curl_cffi>=0.7",
    "openai-whisper>=20231117",
    "python-docx>=1.1",
    "dashscope>=1.20",
    "Pillow>=10",
    # HTTP server 包装层（暴露 commands 为 POST + SSE）
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2",
    "pydantic>=2",
    # .env 加载（仓库根 .env，server 启动时优先于其它 import 触发）
    "python-dotenv>=1.0",
    # NOF_DEV=1 时 server/dev_proxy.py 反代 vite 需要（HTTP + HMR WebSocket）
    # [socks]=socksio：任何 httpx 调用经环境里的 SOCKS 代理（如本地 10808）时需要，否则抛
    # "socksio not installed"。deepseek 已 trust_env=False 绕过代理，此扩展留作其它 httpx 路径的兜底
    "httpx[socks]>=0.27",
    "websockets>=12",
    # Worker 拆分 S3：跨进程任务队列(nof-worker 消费 / 8810 入队)+ 配额原子计数
    "redis>=5",
]

[project.scripts]
ncds-opus-factory = "ncds_opus_factory.cli:main"
nof = "ncds_opus_factory.cli:main"
nof-server = "ncds_opus_factory.server.app:cli_main"
nof-worker = "ncds_opus_factory.server.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "N",       # pep8-naming
  "UP",      # pyupgrade
  "YTT",     # flake8-2020
  "ASYNC",   # flake8-async
  "S",       # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
python_version = "3.11"
strict = false
pretty = true
show_error_codes = true
explicit_package_bases = true
namespace_packages = true
mypy_path = ["src", "packages/core/src"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Monorepo workspace。当前唯一独立子包 = packages/core（纯能力库）；本根包 = factory（含 server +
# 生产引擎 server/engine/ + agents + web）。统一生产引擎方向见 docs/PRODUCTION-ENGINE-DESIGN.md。
# （旧"三包对等拆分"已作废，packages/studio 空骨架已删。）
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
# 仅测试用：queue_test / task_runner_test 用 fakeredis 跑，免 CI 依赖真 redis-server
dev = ["fakeredis>=2", "ruff>=0.15", "mypy>=2.1"]
