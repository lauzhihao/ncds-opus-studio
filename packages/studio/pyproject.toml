[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ncds-opus-studio —— 画布产品（015 节点执行引擎 + studio FastAPI app + 画布路由 + web/ SPA）。
# 单向依赖 core。P0 仅建空骨架，代码在 P3 迁入。
name = "ncds-opus-studio"
version = "0.1.0"
description = "Studio canvas product (pipeline_runner + web SPA). Depends on ncds-opus-core."
requires-python = ">=3.11"
dependencies = ["ncds-opus-core"]

# 本地 workspace 依赖：core 从同仓解析，不去 PyPI 找
[tool.uv.sources]
ncds-opus-core = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
